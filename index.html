<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestión Pre-Entregas — Autosol Jujuy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1f3a;--ink2:#3d5170;--mute:#7b8aa0;--line:#dfe4ec;--paper:#f4f2ec;--card:#fff;
  --vw:#001e50;--acc:#1b6fe0;--acc2:#9cc0f4;--ok:#1f8a5b;--warn:#c9861a;--bad:#c23b3b;
  --side:236px;
  --disp:'VW Head','VW Text Office','Barlow Condensed','Arial Narrow',sans-serif;
  --body:'VW Text Office','VW Text','Barlow','Segoe UI',Arial,sans-serif;
}
:root[data-tema="oscuro"]{
  --ink:#e7eefc;--ink2:#b3c4de;--mute:#8fa3bf;--line:#24395c;--paper:#0a1526;--card:#132540;
  --vw:#4f9bff;--acc:#5aa7ff;--acc2:#2b5c9e;--ok:#2fbd7e;--warn:#e0a63c;--bad:#ff6b6b;
}
:root[data-tema="oscuro"] .side{background:#081221}
:root[data-tema="oscuro"] .nav button.on{background:#1b3a63;color:#e7eefc}
:root[data-tema="oscuro"] th{background:#16283f}
:root[data-tema="oscuro"] .ritmo-fila,:root[data-tema="oscuro"] .ritmo div{background:#16283f}
:root[data-tema="oscuro"] .hb .tr{background:#1a2b45}
:root[data-tema="oscuro"] .p-ok{background:rgba(47,189,126,.15)}
:root[data-tema="oscuro"] .p-w{background:rgba(224,166,60,.15)}
:root[data-tema="oscuro"] .p-b{background:rgba(255,107,107,.15)}
:root[data-tema="oscuro"] .p-n{background:#1a2b45}
:root[data-tema="oscuro"] .btn{background:#16283f;color:var(--ink)}
:root[data-tema="oscuro"] .filt select,:root[data-tema="oscuro"] .filt input,:root[data-tema="oscuro"] .seg,:root[data-tema="oscuro"] .tbar input{background:#16283f;color:var(--ink)}
:root[data-tema="oscuro"] table{background:var(--card)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}

/* Barra lateral */
.side{background:var(--vw);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px}
.side .m1{font-size:12px;color:#9fb3d1}
.side .m2{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.05;margin-top:4px}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#c8d5e8;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:#fff;color:var(--vw);font-weight:600}
.nav .ic{width:20px;text-align:center}
.nav .bdg{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 7px}
.side .pie{font-size:11px;color:#9fb3d1;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}

/* Contenido */
.main{min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:22px 28px 12px}
h1{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1;color:var(--vw)}
.head .desc{color:var(--mute);font-size:13px;margin-top:4px}
.acts{display:flex;gap:8px}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn.pri{background:var(--vw);border-color:var(--vw);color:#fff}
.filt{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filt select,.filt input{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--vw);color:#fff}
.filt .cnt{margin-left:auto;font-size:12px;color:var(--mute)}
.body{padding:18px 28px 50px}
.panel{display:none}.panel.on{display:block}

/* Piezas */
.frase{font-family:var(--disp);font-weight:500;font-size:28px;line-height:1.25;max-width:32em;margin-bottom:6px}
.frase b{font-weight:700;color:var(--vw)}
.sub{color:var(--mute);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0 18px}
.k{background:#fff;padding:14px 16px}
.k .n{font-family:var(--disp);font-weight:700;font-size:clamp(24px,2.4vw,34px);line-height:1;color:var(--vw);white-space:nowrap}
.k .l{font-size:13px;color:var(--ink2);margin-top:6px}
.k .d{font-size:12px;margin-top:3px;color:var(--mute)}
.k .d.up{color:var(--ok)}.k .d.dn{color:var(--bad)}
.g{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h3{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.card h3 span{font-weight:400;color:var(--mute)}
.big{font-family:var(--disp);font-weight:700;font-size:42px;line-height:1;color:var(--vw)}
.big small{font-size:17px;color:var(--mute);font-weight:500}
.hb{display:grid;grid-template-columns:minmax(90px,160px) 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.hb .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:12px;background:#eef1f6;border-radius:3px;overflow:hidden}
.hb .f{display:block;height:100%;background:var(--acc)}
.hb .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hb.cl{cursor:pointer}.hb.cl:hover .t{color:var(--acc);text-decoration:underline}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:160px;padding-top:10px}
.col{display:flex;gap:2px;align-items:end;height:100%}
.col i{flex:1;display:block;border-radius:2px 2px 0 0;min-height:1px}
.col i.a{background:var(--acc2)}.col i.b{background:var(--vw)}
.col.sel{outline:2px solid var(--warn);outline-offset:3px;border-radius:3px}
.mes{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;font-size:11px;color:var(--mute);text-align:center;margin-top:6px}
.ley{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px}
.ley span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.tw{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{position:sticky;top:0;background:#f7f8fb;text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line);padding:7px 9px;white-space:nowrap;cursor:pointer}
td{border-bottom:1px solid var(--line);padding:6px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.p-ok{background:#e3f3ea;color:var(--ok)}.p-w{background:#fbf0dc;color:var(--warn)}.p-b{background:#f8e1e1;color:var(--bad)}.p-n{background:#eef1f6;color:var(--ink2)}
.rk{columns:2;column-gap:26px;font-size:13px}
.rk div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:4px 0;break-inside:avoid}
.rk em{font-style:normal;color:var(--mute);display:inline-block;width:26px}
.vacio{color:var(--mute);font-size:13px;padding:6px 0}
.tbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tbar input{flex:1;min-width:180px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 10px}

/* Alertas */
.al{display:grid;gap:8px}
.a{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 0;cursor:pointer}
.a:hover{border-color:var(--acc)}
.a i{align-self:stretch;border-radius:10px 0 0 10px}
.a.b i{background:var(--bad)}.a.w i{background:var(--warn)}.a.o i{background:var(--ok)}.a.n i{background:var(--acc)}
.a b{display:block;font-size:14px}.a p{font-size:12px;color:var(--ink2)}
.a .go{font-size:12px;color:var(--acc);white-space:nowrap}
.ritmo-tabla{display:grid;gap:8px}
.ritmo-fila{display:grid;grid-template-columns:1.1fr repeat(4,1fr);gap:10px;align-items:center;background:#f7f8fb;border-radius:8px;padding:10px 12px}
.ritmo-fila .rf-t{font-weight:600;color:var(--ink2)}
.ritmo-fila>div:not(.rf-t){font-family:var(--disp);font-weight:700;font-size:24px;color:var(--vw);line-height:1.05}
.ritmo-fila .rf-p{color:var(--acc)}
.ritmo-fila small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--mute);margin-top:2px}
.ritmo-fila .rf-m span{font-size:14px}
@media(max-width:700px){.ritmo-fila{grid-template-columns:1fr 1fr;row-gap:8px}.ritmo-fila .rf-t{grid-column:1/-1}}
.ritmo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.ritmo div{background:#f7f8fb;border-radius:8px;padding:10px}
.ritmo .n{font-family:var(--disp);font-weight:700;font-size:26px;color:var(--vw);line-height:1}
.ritmo .l{font-size:12px;color:var(--ink2);margin-top:4px}
.prog{height:10px;background:#eef1f6;border-radius:99px;overflow:hidden;margin-top:12px}
.prog span{display:block;height:100%;background:var(--vw)}


/* Selector ejecutivo de gráficos */
.chart-switch{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;padding:4px;background:#eef2f7;border:1px solid var(--line);border-radius:10px;width:max-content;max-width:100%}
.chart-switch button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12px;font-weight:700;padding:7px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.chart-switch button:hover{background:#fff;color:var(--vw)}
.chart-switch button.on{background:var(--vw);color:#fff;box-shadow:0 2px 8px rgba(0,30,80,.18)}
.exec-chart{min-height:250px}
.linechart{position:relative;padding:12px 8px 0}
.linechart svg{display:block;width:100%;height:220px;overflow:visible}
.linechart .grid{stroke:#e5eaf1;stroke-width:1}
.linechart .axistext{fill:#7b8aa0;font-size:10px;font-family:var(--body)}
.linechart .path{fill:none;stroke:var(--vw);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.linechart .area{fill:rgba(27,111,224,.08)}
.linechart .dot{fill:#fff;stroke:var(--vw);stroke-width:2.5}
.linechart .goal{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:6 5}
.linechart .goaltext{fill:var(--warn);font-size:10px;font-weight:700;font-family:var(--body)}
.linechart-labels{display:grid;grid-template-columns:repeat(12,1fr);font-size:10px;color:var(--mute);text-align:center;margin-top:4px}
.chart-headline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:4px}
.chart-headline .metric{font-family:var(--disp);font-size:32px;font-weight:700;color:var(--vw);line-height:1}
.chart-headline .metric small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--mute);margin-left:5px}
@media(max-width:600px){.chart-switch{width:100%}.chart-switch button{flex:1}.linechart svg{height:190px}.chart-headline{align-items:flex-start;flex-direction:column}}

@media(max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:14px}
  .nav{flex-direction:row;overflow-x:auto;margin-top:10px}
  .nav button{white-space:nowrap}
  .side .pie{display:none}
  .g2,.g3,.g21{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .head,.filt,.body{padding-left:14px;padding-right:14px}
  .filt{position:static}
  .frase{font-size:22px}.rk{columns:1}.ritmo{grid-template-columns:1fr}
}
.toast{position:fixed;left:0;right:0;bottom:22px;margin:0 auto;width:min(420px,92vw);background:#fff;border:1px solid var(--line);border-left:5px solid var(--vw);border-radius:12px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.18);z-index:50}
.toast p{font-size:13px;color:var(--ink2);margin:4px 0 10px}
@media print{
  @page{size:A4;margin:11mm}
  body{background:#fff;font-size:11px}
  .side,.filt,.acts,.tbar{display:none!important}
  .app{display:block}.head,.body{padding:0}.head{margin-bottom:8px}
  .card{break-inside:avoid;border-color:#ccc}
  .tw{max-height:none;overflow:visible}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ═══ MEJORA VISUAL EJECUTIVA v2 ═══ */
:root{--shadow:0 8px 28px rgba(0,30,80,.07);--shadow2:0 12px 34px rgba(0,30,80,.12);--soft:#f7f9fc}
body{background:linear-gradient(135deg,#f5f3ee 0%,#f7f9fc 55%,#f2f5f9 100%)}
.side{box-shadow:8px 0 30px rgba(0,30,80,.10);z-index:8}
.side .m1{letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.side .m2{font-size:28px;letter-spacing:-.02em}
.nav button{transition:.18s ease;border:1px solid transparent}
.nav button:hover{transform:translateX(2px)}
.nav button.on{box-shadow:0 5px 18px rgba(0,0,0,.13)}
.head{padding-top:26px}
h1{letter-spacing:-.025em}
.head .desc{max-width:760px}
.btn{transition:.16s ease;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,30,80,.09)}
.filt{background:rgba(244,242,236,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.filt select,.filt input{min-height:36px;transition:.16s ease}
.filt select:focus,.filt input:focus,.tbar input:focus{outline:2px solid rgba(27,111,224,.20);border-color:var(--acc)}
.frase{font-size:30px;letter-spacing:-.018em;max-width:38em}
.kpis{gap:10px;background:transparent;border:0;overflow:visible}
.k{border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 14px rgba(0,30,80,.045);position:relative;overflow:hidden;transition:.18s ease}
.k:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--acc),var(--vw));opacity:.85}
.k:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.k .n{letter-spacing:-.02em}
.card{box-shadow:0 3px 16px rgba(0,30,80,.045);transition:box-shadow .18s ease,border-color .18s ease}
.card:hover{box-shadow:var(--shadow);border-color:#d3dce9}
.card h3{font-size:13px;letter-spacing:.01em;border-bottom:1px solid #edf0f5;padding-bottom:10px}
.hb{padding:3px 0;margin:2px 0}
.hb .tr{height:13px;background:linear-gradient(90deg,#edf1f6,#f5f7fa);box-shadow:inset 0 0 0 1px rgba(0,30,80,.025)}
.hb .f{background:linear-gradient(90deg,var(--acc),#3f8bed);transition:width .35s ease,filter .15s ease}
.hb:hover .f{filter:brightness(.92)}
.hb .v{font-weight:700;color:var(--vw)}
.cols{height:190px;position:relative;border-bottom:1px solid #cfd7e3;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),#edf1f6 25%);padding:22px 4px 0}
.col{position:relative;z-index:1}
.col i{transition:height .35s ease,filter .15s ease;box-shadow:0 1px 2px rgba(0,30,80,.08)}
.col:hover i{filter:brightness(.93)}
.col.sel{outline:2px solid var(--warn);outline-offset:4px;background:rgba(201,134,26,.05)}
.mes{font-weight:600;color:#6f7f96;padding:0 4px}
.ley{align-items:center;padding-top:2px}
.ech{width:100%;min-width:0}
.chart-note{font-size:11px;color:var(--mute);margin-top:6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chart-note b{color:var(--ink2)}
.tw{box-shadow:inset 0 1px 0 rgba(0,0,0,.02)}
tbody tr:hover td,table tr:hover td{background:#f7f9fc}
th{z-index:2}
.a{transition:.16s ease;box-shadow:0 2px 8px rgba(0,30,80,.035)}
.a:hover{transform:translateX(2px);box-shadow:0 5px 14px rgba(0,30,80,.07)}
.ritmo div{border:1px solid #edf0f5;background:linear-gradient(180deg,#fafbfd,#f5f7fa)}
.prog{height:12px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.prog span{background:linear-gradient(90deg,var(--acc),var(--vw))}
.pill{border:1px solid rgba(0,0,0,.035)}
@media(max-width:680px){.kpis{grid-template-columns:1fr}.frase{font-size:24px}.cols{height:165px}.body{padding-top:12px}}
@media print{.k,.card{box-shadow:none!important}.k:before{display:none}.card:hover,.k:hover{transform:none}}


/* Modo oscuro: pisa los estilos decorativos que vienen con colores fijos */
:root[data-tema="oscuro"] body{background:linear-gradient(135deg,#08111f 0%,#0c1a2e 55%,#0a1526 100%)}
:root[data-tema="oscuro"] .card,:root[data-tema="oscuro"] .k,:root[data-tema="oscuro"] .a{background:var(--card);border-color:var(--line)}
:root[data-tema="oscuro"] .kpis{background:var(--line);border-color:var(--line)}
:root[data-tema="oscuro"] .filt{background:rgba(10,21,38,.92);border-color:var(--line)}
:root[data-tema="oscuro"] .tw{border-color:var(--line)}
:root[data-tema="oscuro"] td{border-color:var(--line)}
:root[data-tema="oscuro"] .seg button.on{background:var(--acc);color:#04101f}
:root[data-tema="oscuro"] .btn.pri{background:var(--acc);border-color:var(--acc);color:#04101f}
:root[data-tema="oscuro"] .chart-switch button.on{background:var(--acc);color:#04101f}
:root[data-tema="oscuro"] .toast{background:var(--card)}
:root[data-tema="oscuro"] .prog{background:#1a2b45}
:root[data-tema="oscuro"] .side{box-shadow:8px 0 30px rgba(0,0,0,.4)}

/* Pantalla de acceso */
.login{position:fixed;inset:0;background:linear-gradient(135deg,#001e50 0%,#0b2d63 60%,#001433 100%);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.login.hidden{display:none}
.login-box{background:var(--card);border-radius:16px;padding:34px 28px;width:min(360px,100%);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.marca-mini{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:600}
.titulo-login{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.05;color:var(--vw);margin-top:6px}
.login-box input{width:100%;margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font:inherit;font-size:15px;outline:none;text-align:center}
.login-box input:focus{border-color:var(--acc)}
.login-box .btn{width:100%;margin-top:12px;padding:12px}
.login-err{min-height:20px;margin-top:12px;font-size:12px;font-weight:600;color:var(--bad)}
.login-foot{margin-top:4px;font-size:11px;color:var(--mute)}
@media print{.login{display:none!important}}

/* Cortina de carga */
.cargando{position:fixed;inset:0;background:rgba(244,242,236,.82);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:90}
:root[data-tema="oscuro"] .cargando{background:rgba(10,21,38,.86)}
.cargando.oculto{display:none}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.18);max-width:300px}
.cbox b{display:block;margin-top:12px;font-size:15px;color:var(--ink)}
.cbox p{font-size:12px;color:var(--mute);margin-top:4px}
.spin{width:34px;height:34px;margin:0 auto;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

/* Modo oscuro: más contraste en los textos secundarios, que en el celular quedaban lavados */
:root[data-tema="oscuro"]{--ink:#f2f7ff;--ink2:#cbd9ef;--mute:#a3b6d2}
:root[data-tema="oscuro"] .sub,:root[data-tema="oscuro"] .k .l,:root[data-tema="oscuro"] .card h3{color:var(--ink2)}
:root[data-tema="oscuro"] .card h3 span,:root[data-tema="oscuro"] .k .d{color:var(--mute)}
:root[data-tema="oscuro"] td,:root[data-tema="oscuro"] .a p{color:var(--ink)}
@media print{.cargando{display:none!important}}

/* Filtros en botones */
.btns{display:inline-flex;gap:3px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.btns button{all:unset;cursor:pointer;padding:5px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.btns button:hover{background:var(--paper)}
.btns button.on{background:var(--vw);color:#fff;font-weight:600}
:root[data-tema="oscuro"] .btns button.on{background:var(--acc);color:#04101f}
@media(max-width:700px){.btns{width:100%;justify-content:space-between}.btns button{padding:6px 7px;font-size:12px}}
@media print{.btns{display:none}}

/* Tarjetas de cumplimiento con aro */
.aro-card{display:flex;align-items:center;justify-content:space-between;gap:14px}
.aro-t{font-size:13px;font-weight:600;color:var(--ink2)}
.aro-n{font-family:var(--disp);font-weight:700;font-size:38px;line-height:1.05;margin-top:4px}
.aro-d{font-size:12px;color:var(--mute);margin-top:2px}
.aro{width:64px;height:64px;flex:none}

/* ═══ TABLERO DE GESTIÓN ═══════════════════════════════════════════════════
   Pantalla única del sector. Va siempre en oscuro, con cualquier tema, porque
   está pensada para quedar abierta en un monitor. Todo lo de acá adentro usa
   sus propias variables (--t-*), así no se mezcla con el resto del portal.
   ──────────────────────────────────────────────────────────────────────── */
.tb{--t-bg:#081221;--t-card:#10203a;--t-card2:#172b4b;--t-line:#24395c;--t-tx:#f2f7ff;--t-tx2:#cbd9ef;--t-mu:#a3b6d2;
  --t-az:#3987e5;--t-nj:#d95926;--t-ag:#12a594;--t-vi:#8e6ae0;--t-gr:#8fa3bf;
  --t-ok:#2fbd7e;--t-warn:#fab219;--t-bad:#ff6b6b;
  background:var(--t-bg);color:var(--t-tx);border-radius:16px;padding:14px;display:grid;gap:12px;min-width:0}
.tb button{font:inherit;color:inherit;text-align:left;cursor:pointer;border:0;background:none}
.tb button:focus-visible{outline:2px solid var(--t-tx);outline-offset:2px}
.tb-top{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:2px 4px}
.tb-top b{font-family:var(--disp);font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.tb-top span{color:var(--t-mu);font-size:12px;margin-left:10px}
.tb-live{font-size:12px;color:var(--t-tx2);display:flex;align-items:center;gap:8px}
.tb-live i{width:8px;height:8px;border-radius:50%;background:var(--t-ok);animation:tbPulso 2s infinite}
@keyframes tbPulso{0%{box-shadow:0 0 0 0 rgba(47,189,126,.6)}70%{box-shadow:0 0 0 8px rgba(47,189,126,0)}100%{box-shadow:0 0 0 0 rgba(47,189,126,0)}}
@media(prefers-reduced-motion:reduce){.tb-live i{animation:none}}

/* Fila de indicadores */
.tb-k{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tb .tb-t{background:var(--t-card);border:1px solid var(--t-line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .16s,transform .16s}
.tb .tb-t:hover{border-color:var(--c);transform:translateY(-2px)}
.tb-th{display:flex;align-items:center;gap:10px}
.tb-ic{width:34px;height:34px;border-radius:9px;background:var(--c);color:#04101f;display:grid;place-items:center;flex:none}
.tb-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tb-tl{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--t-tx2);line-height:1.1}
.tb-n{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tb-n b{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.tb-dl{font-size:13px;font-weight:700}
.tb-dl.up{color:var(--t-ok)}.tb-dl.dn{color:var(--t-bad)}
.tb-n small{font-size:11px;color:var(--t-mu);display:block}
.tb-sp{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--t-card2)}
.tb-sp i{display:block;height:100%}
.tb-sl{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--t-tx2)}
.tb-sl span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px}
.tb-pie{font-size:12px;color:var(--t-mu);margin-top:auto}
.tb-pie b{color:var(--t-tx)}

/* Tarjetas */
.tb-g{display:grid;gap:12px}
.tb-g.r2{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr)}
.tb-g.r3{grid-template-columns:repeat(4,minmax(0,1fr))}
.tb-g.r4{grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,1fr)}
.tb-c{background:var(--t-card);border:1px solid var(--t-line);border-radius:12px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.tb-c h4{font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tb-c h4 span{font-family:var(--body);font-weight:400;font-size:11px;letter-spacing:0;text-transform:none;color:var(--t-mu)}
.tb-nota{font-size:11px;color:var(--t-mu);margin-top:auto}
.tb .vacio{color:var(--t-mu)}

/* Flujo */
.tb-fl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.tb .tb-fl button{background:var(--c);color:#04101f;padding:10px 6px 10px 20px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);min-width:0}
.tb .tb-fl button:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:12px;border-radius:8px 0 0 8px}
.tb-fl small{display:block;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.tb-fl b{font-family:var(--disp);font-size:30px;line-height:1}
.tb-pe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tb .tb-pe button{background:var(--t-card2);border:1px solid var(--t-line);border-radius:10px;padding:10px;min-height:44px}
.tb .tb-pe button:hover{border-color:var(--t-tx2)}
.tb-pe b{display:block;font-family:var(--disp);font-size:28px;line-height:1}
.tb-pe small{display:block;font-size:11px;color:var(--t-tx2);margin-top:4px;line-height:1.25}

/* Leyendas y listas */
.tb-ley{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--t-tx2)}
.tb-ley span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:-1px}
.tb-dn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:center}
.tb-dl2{display:grid;gap:6px;font-size:12px}
.tb-dl2 div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}
.tb-dl2 i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.tb-dl2 span{color:var(--t-tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-dl2 b{font-variant-numeric:tabular-nums}

/* Barras horizontales */
.tb-hb{display:grid;gap:8px}
.tb .tb-hb button{display:grid;grid-template-columns:minmax(74px,auto) 1fr 30px 38px;gap:8px;align-items:center;font-size:12px;min-height:26px;border-radius:6px;padding:2px 4px}
.tb .tb-hb button:hover{background:var(--t-card2)}
.tb-hb .tr{height:14px;background:var(--t-card2);border-radius:4px;overflow:hidden}
.tb-hb .tr i{display:block;height:100%;background:var(--c);border-radius:0 4px 4px 0}
.tb-hb b{text-align:right;font-variant-numeric:tabular-nums}
.tb-hb em{font-style:normal;text-align:right;color:var(--t-mu);font-variant-numeric:tabular-nums}
.tb-hb span{color:var(--t-tx2)}
.tb-sub{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--t-mu);margin-top:2px}

/* Techo */
.tb-te{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.tb-aro{position:relative;width:108px;height:108px}
.tb-aro svg{width:100%;height:100%;transform:rotate(-90deg)}
.tb-aro div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.tb-aro b{font-family:var(--disp);font-size:30px;line-height:1}
.tb-aro small{font-size:10px;color:var(--t-mu)}
.tb-tl2{display:grid;gap:6px;font-size:12px}
.tb-tl2 div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--t-line);padding-bottom:5px}
.tb-tl2 span{color:var(--t-tx2)}
.tb-est{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.tb-est i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* Accesorios y contratos */
.tb-ac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tb .tb-ac button{background:var(--t-card2);border:1px solid var(--t-line);border-radius:10px;padding:10px;min-width:0}
.tb .tb-ac button:hover{border-color:var(--t-tx2)}
.tb-ac small{display:block;font-size:11px;color:var(--t-tx2)}
.tb-ac b{display:block;font-family:var(--disp);font-size:26px;line-height:1.1;white-space:nowrap}
.tb-ac em{display:block;font-style:normal;font-size:11px;color:var(--t-mu)}
.tb-pr{height:6px;background:var(--t-bg);border-radius:99px;overflow:hidden;margin-top:6px}
.tb-pr i{display:block;height:100%;background:var(--c)}

/* Alertas */
.tb-chips{display:flex;gap:6px;flex-wrap:wrap}
.tb-chip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--c);color:var(--t-tx)}
.tb-chip::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px}
.tb-al{display:grid;gap:6px}
.tb .tb-al button{display:grid;grid-template-columns:78px minmax(0,1fr) 40px minmax(0,.9fr);gap:10px;align-items:center;background:var(--t-card2);border:1px solid var(--t-line);border-radius:10px;padding:8px 10px;font-size:12px;min-height:44px}
.tb .tb-al button:hover{border-color:var(--c)}
.tb-al .pr{font-weight:700;font-size:11px;display:flex;align-items:center;gap:6px}
.tb-al .pr::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tb-al b{font-family:var(--disp);font-size:22px;text-align:right;line-height:1}
.tb-al em{font-style:normal;color:var(--t-mu)}
.tb-okk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t-tx2)}
.tb-okk::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--t-ok)}

@media(max-width:1500px){.tb-k{grid-template-columns:repeat(3,minmax(0,1fr))}.tb-g.r3{grid-template-columns:repeat(2,minmax(0,1fr))}.tb-g.r4{grid-template-columns:repeat(2,minmax(0,1fr))}.tb-g.r4>:first-child{grid-column:1/-1}}
@media(max-width:1150px){.tb-g.r2{grid-template-columns:repeat(2,minmax(0,1fr))}.tb-g.r2>:nth-child(2){grid-column:1/-1;order:-1}}
@media(max-width:700px){.tb{padding:10px;border-radius:12px}.tb-k{grid-template-columns:repeat(2,minmax(0,1fr))}.tb-g.r2,.tb-g.r3,.tb-g.r4{grid-template-columns:minmax(0,1fr)}.tb-n b{font-size:32px}.tb .tb-al button{grid-template-columns:70px minmax(0,1fr) 34px}.tb-al em{grid-column:2/-1}.tb-top span{margin-left:0;display:block}}
@media print{.tb{border-radius:0}.tb-live{display:none}}
</style>
</head>
<body>
<div class="login" id="loginOverlay">
  <div class="login-box">
    <div class="marca-mini">Autosol Jujuy · Volkswagen</div>
    <div class="titulo-login">Gestión<br>Pre-Entregas</div>
    <input type="password" id="loginPass" placeholder="Clave de acceso" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn pri" id="loginBtn" onclick="login()">Ingresar</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-foot">La sesión vence a las 12 horas</div>
  </div>
</div>

<div class="app">
  <aside class="side">
    <div class="m1">Autosol Jujuy · Volkswagen</div>
    <div class="m2">Gestión<br>Pre-Entregas</div>
    <nav class="nav" id="nav"></nav>
    <div class="pie" id="pie"></div>
  </aside>

  <main class="main">
    <div class="head">
      <div><h1 id="tit"></h1><div class="desc" id="desc"></div></div>
      <div class="acts">
        <button class="btn" onclick="cargar(1)" title="Volver a leer los datos">↻ Actualizar</button>
        <button class="btn" id="btnTema" onclick="cambiarTema()" title="Cambiar entre claro y oscuro">🌙</button>
        <button class="btn" onclick="descargar()">⬇ Excel</button>
        <button class="btn" onclick="window.print()">🖨 Imprimir</button>
        <button class="btn pri" onclick="pdf()">📄 Guardar PDF</button>
      </div>
    </div>
    <div class="filt">
      <div class="seg" id="modo"><button data-m="mes" class="on">Mes</button><button data-m="anio">Acumulado año</button></div>
      <div class="btns" id="fAnio"></div>
      <div class="btns" id="fMes"></div>
      <select id="fMod"><option value="">Todos los modelos</option></select>
      <select id="fCanal"><option value="">Todos los canales</option></select>
      <select id="fVend"><option value="">Todos los vendedores</option></select>
      <button class="btn" onclick="limpiar()">✕ Limpiar</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="body" id="body"></div>
  </main>
</div>
